<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>練習管理システム</title>
    <style>
      :root {
        --primary: #9c4a4a; --bg: #f8f6f1; --paper: #fdfcf9; --accent: #cdb672;
        --ink: #4a443f; --soft: #9a928a; --line: #ece7df;
        --serif: "Hiragino Mincho ProN", "Yu Mincho", "Noto Serif JP", serif;
      }
      body {
        font-family: "Hiragino Sans", "Yu Gothic UI", "Meiryo", sans-serif; color: var(--ink);
        background-color: var(--bg); margin: 0; padding: 12px 12px 40px;
        display: flex; flex-direction: column; align-items: center;
      }
      .container {
        width: 100%; max-width: 500px; background: #fff; padding: 20px; border-radius: 16px;
        border: 1px solid var(--line); box-shadow: 0 4px 18px rgba(60, 40, 20, 0.06); box-sizing: border-box;
      }

      /* ヘッダー */
      #userSection {
        width: 100%; max-width: 500px; display: flex; align-items: center; justify-content: space-between;
        gap: 8px; margin-bottom: 12px; font-size: 14px; flex-wrap: wrap;
      }
      .brand { display: flex; align-items: center; gap: 8px; }
      .crest {
        width: 32px; height: 32px; border-radius: 50%; background: var(--primary); color: #fff;
        display: inline-flex; align-items: center; justify-content: center; font-family: var(--serif); font-size: 17px;
      }
      .brand-name { font-family: var(--serif); font-weight: bold; font-size: 17px; letter-spacing: 0.12em; }
      #loginArea, #loggedInUser { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; justify-content: flex-end; }
      #userNameInput { width: 110px; padding: 7px 10px; font-size: 16px; }
      #userNameDisplay { font-weight: bold; }

      /* カレンダー */
      .cal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; }
      #monthYear { margin: 0; font-family: var(--serif); font-size: 20px; letter-spacing: 0.08em; user-select: none; -webkit-user-select: none; }
      .nav-btn {
        cursor: pointer; width: 40px; height: 40px; background: var(--paper); border: 1px solid var(--line);
        border-radius: 50%; font-size: 22px; line-height: 1; color: var(--primary); font-family: inherit;
      }
      .nav-btn:active { background: var(--line); }

      #calendar { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; }
      .dayName { text-align: center; font-size: 11px; color: var(--soft); padding-bottom: 2px; }
      .dayName.sun, .dateBtn.sun .date-num { color: #c97b72; }
      .dayName.sat, .dateBtn.sat .date-num { color: #6f97bd; }
      .dateBtn {
        aspect-ratio: 5/7; background: var(--paper); border: 1px solid var(--line); border-radius: 10px; overflow: hidden;
        display: flex; flex-direction: column; align-items: center; justify-content: flex-start;
        cursor: pointer; padding-top: 6px; transition: box-shadow 0.15s, border-color 0.15s;
      }
      .dateBtn:hover { border-color: var(--accent); box-shadow: 0 2px 8px rgba(60, 40, 20, 0.1); }
      .date-num { font-weight: bold; font-size: 15px; width: 26px; height: 26px; line-height: 26px; text-align: center; border-radius: 50%; }
      .room-label { font-size: 9px; width: 100%; text-align: center; margin-top: auto; padding: 3px 0; background: #f3ead2; color: #6b5310; font-weight: bold; }
      .dateBtn.today { border-color: var(--primary); background: #fff; }
      .dateBtn.today .date-num { background: var(--primary); color: #fff; }

      /* 参加状況 */
      #selectedDateText { margin: 0 0 8px; font-family: var(--serif); font-size: 22px; letter-spacing: 0.05em; user-select: none; -webkit-user-select: none; }
      .loading { color: var(--soft); padding: 20px 0; text-align: center; }
      .slot-box { border: 1px solid var(--line); border-radius: 12px; padding: 14px; margin-top: 12px; background: #fff; }
      .slot-box.joined { border-color: #d9b0b0; background: #fffbfa; }
      .slot-title { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
      .slot-time { font-weight: bold; font-size: 17px; }
      .slot-count { font-size: 12px; color: var(--soft); background: var(--bg); border-radius: 999px; padding: 2px 9px; margin-left: 8px; }
      .participant-list { list-style: none; padding: 0; margin: 12px 0 0; display: flex; flex-direction: column; align-items: flex-start; gap: 8px; }
      .participant-list li { font-size: 15px; }
      .participant-list li.empty { color: var(--soft); font-size: 13px; }

      /* ネームプレート（段位で背景色が変わる） */
      .plate {
        display: inline-flex; align-items: center; gap: 8px; min-width: 150px;
        padding: 6px 14px; border: 1px solid #cfc8bc; border-radius: 6px;
        font-weight: bold; letter-spacing: 0.05em; background: transparent; color: var(--ink);
        box-shadow: 0 1px 2px rgba(60, 40, 20, 0.12); user-select: none; -webkit-user-select: none; -webkit-touch-callout: none;
      }
      .rank-badge { font-size: 11px; padding: 1px 6px; border-radius: 3px; background: rgba(255,255,255,0.8); color: var(--ink); font-weight: normal; }
      .plate.rank-A { background: #f9d6d2; border-color: #e9b4ae; }
      .plate.rank-B { background: #fcf5cf; border-color: #e6da9c; }
      .plate.rank-C { background: #dbefde; border-color: #b3d6b8; }
      .plate.rank-D { background: #d9e9f9; border-color: #b0cdea; }
      .plate.rank-E { background: transparent; }
      .plate.rank-E .rank-badge { border: 1px solid #bbb; }

      /* 裏装飾 */
      .plate.flair-gold {
        background: linear-gradient(110deg, #b8860b 0%, #ffe082 30%, #fff8dc 45%, #ffd54f 60%, #b8860b 100%);
        background-size: 250% 100%; border-color: #8d6e00; color: #3e2700;
        animation: plateShine 2.5s linear infinite;
      }
      .plate.flair-rainbow {
        background: linear-gradient(90deg, #ff5252, #ffb300, #ffee58, #66bb6a, #42a5f5, #ab47bc, #ff5252);
        background-size: 300% 100%; border-color: #555; color: #fff; text-shadow: 0 1px 2px rgba(0,0,0,0.6);
        animation: plateShine 4s linear infinite;
      }
      .plate.flair-glitch {
        background: #111; border-color: #0f0; color: #0f0; font-family: monospace;
        animation: plateGlitch 1.2s steps(1) infinite;
      }
      .plate.flair-sakura { background: linear-gradient(135deg, #ffe4ec, #ffc1d6); border-color: #f48fb1; color: #7a1f44; }
      .plate.flair-sakura::after { content: "🌸"; margin-left: auto; }
      .plate.flair-sumi { background: #1c1c1c; border-color: #000; color: #f5f5f0; font-family: serif; letter-spacing: 0.2em; }
      @keyframes plateShine { from { background-position: 250% 0; } to { background-position: 0 0; } }
      @keyframes plateGlitch {
        0%, 100% { transform: none; text-shadow: none; }
        10% { transform: translate(-2px, 1px) skewX(-8deg); text-shadow: 2px 0 #f0f, -2px 0 #0ff; }
        20% { transform: none; text-shadow: none; }
        60% { transform: translate(2px, -1px); text-shadow: -2px 0 #f0f, 2px 0 #0ff; }
        70% { transform: none; text-shadow: none; }
      }
      @media (prefers-reduced-motion: reduce) { .plate { animation: none !important; } }

      #profileArea { display: inline-flex; gap: 6px; }
      #profileArea select { width: auto; padding: 6px 8px; font-size: 13px; }
      .petal { position: fixed; top: -40px; font-size: 22px; pointer-events: none; z-index: 1000; animation: petalFall linear forwards; }
      @keyframes petalFall { to { transform: translateY(110vh) rotate(540deg); opacity: 0.2; } }
      /* 裏テーマ「ちはやふる」 */
      body.momiji { background: linear-gradient(180deg, #ffd0b8 0%, #fff1e0 60%, #ffe0cc 100%) fixed; }
      body.momiji .container { border-top: 4px solid #b71c1c; }
      body.momiji .dateBtn { background: #fff8f3; }
      body.momiji .dateBtn.today { background: #ffebe6; border-color: #b71c1c; }
      #toast {
        position: fixed; left: 50%; bottom: 30px; transform: translateX(-50%); background: rgba(0,0,0,0.85); color: #fff;
        padding: 10px 18px; border-radius: 20px; font-size: 14px; z-index: 1001; display: none; max-width: 90%; text-align: center;
      }

      .admin-note { background: var(--paper); padding: 16px; border: 1px solid var(--line); border-radius: 12px; margin-top: 24px; }
      .admin-title { font-family: var(--serif); font-weight: bold; color: var(--primary); margin-bottom: 12px; }
      .admin-note label { display: block; font-size: 12px; color: var(--soft); letter-spacing: 0.08em; }
      textarea, select, #userNameInput {
        border: 1px solid var(--line); border-radius: 8px; background: #fff; color: var(--ink);
        font-family: inherit; box-sizing: border-box;
      }
      textarea, .admin-note select { width: 100%; padding: 10px 12px; margin: 5px 0 14px; font-size: 16px; }
      textarea:focus, select:focus, #userNameInput:focus { outline: 2px solid rgba(156, 74, 74, 0.2); border-color: var(--primary); }
      .save-btn, .btn-primary { background: var(--primary); color: #fff; border: none; font-weight: bold; border-radius: 8px; cursor: pointer; font-family: inherit; }
      .save-btn { width: 100%; padding: 12px; font-size: 16px; }
      .btn-primary { padding: 7px 14px; font-size: 14px; }
      .save-btn:active, .btn-primary:active { opacity: 0.85; }
      .btn-ghost { background: none; border: 1px solid var(--line); color: var(--soft); border-radius: 8px; padding: 6px 10px; font-size: 13px; cursor: pointer; font-family: inherit; }
      .join-btn {
        padding: 7px 18px; background: #fff; border: 1.5px solid var(--primary); color: var(--primary);
        border-radius: 999px; cursor: pointer; font-weight: bold; font-size: 14px; font-family: inherit; flex-shrink: 0;
      }
      .join-btn.active { background: var(--primary); color: #fff; }
      .back-link { background: none; border: none; padding: 0; color: var(--primary); cursor: pointer; margin-bottom: 12px; font-size: 14px; font-family: inherit; }
    </style>
  </head>
  <body>
    <header id="userSection">
      <div class="brand"><span class="crest">歌</span><span class="brand-name">練習管理</span></div>
      <div id="loginArea">
        <input id="userNameInput" placeholder="名前" autocomplete="nickname">
        <button class="btn-primary" onclick="login()">入室</button>
      </div>
      <div id="loggedInUser" style="display:none">
        <span id="userNameDisplay"></span>
        <span id="profileArea">
          <select id="rankSelect" onchange="saveProfile()" aria-label="段位">
            <option value="">段位未設定</option>
            <option value="A">A級</option>
            <option value="B">B級</option>
            <option value="C">C級</option>
            <option value="D">D級</option>
            <option value="E">E級</option>
          </select>
          <select id="flairSelect" onchange="saveProfile()" aria-label="裏装飾" style="display:none">
            <option value="">裏装飾なし</option>
            <option value="gold">名人（金）</option>
            <option value="rainbow">永世（虹）</option>
            <option value="glitch">バグ級</option>
            <option value="sakura">桜</option>
            <option value="sumi">墨</option>
          </select>
        </span>
        <button class="btn-ghost" onclick="logout()">退室</button>
      </div>
    </header>

    <div class="container" id="calendarView">
      <div class="cal-header">
        <button class="nav-btn" onclick="changeMonth(-1)" aria-label="前月">‹</button>
        <h3 id="monthYear"></h3>
        <button class="nav-btn" onclick="changeMonth(1)" aria-label="次月">›</button>
      </div>
      <div id="calendar"></div>
    </div>

    <div class="container" id="detailView" style="display:none">
      <button class="back-link" onclick="backToCalendar()">‹ カレンダーに戻る</button>
      <h2 id="selectedDateText"></h2>

      <div id="slotList"></div>

      <div class="admin-note">
        <div class="admin-title">この日の設定</div>
        <label for="roomSelect">部屋</label>
        <select id="roomSelect">
          <option value="">未設定</option>
          <option value="和室A">和室A</option>
          <option value="和室B・C">和室B・C</option>
          <option value="和室A・B・C">和室A・B・C</option>
        </select>
        <label for="noteText">連絡事項</label>
        <textarea id="noteText" rows="2"></textarea>
        <button class="save-btn" id="saveAdminBtn">この日の情報を保存</button>
      </div>
    </div>

    <div id="toast"></div>

    <script>
      const API_BASE_URL = window.location.origin;
      let currentUser = localStorage.getItem("userName");
      const slots = ["9:00～10:30", "10:40～12:10", "13:00～14:30", "14:40～16:10", "16:30～18:00", "18:10～19:40"];
      
      // 現在表示している年月を管理
      let viewDate = new Date();

      // 段位・装飾（名前 → {rank, flair}）
      const RANKS = ["A", "B", "C", "D", "E"];
      const FLAIR_LABELS = { gold: "名人", rainbow: "永世", glitch: "ﾊﾞｸﾞ級", sakura: "桜", sumi: "墨" };
      let membersMap = {};
      const POEMS = [
        "ちはやぶる 神代も聞かず 竜田川 からくれなゐに 水くくるとは（在原業平朝臣）",
        "難波津に 咲くやこの花 冬ごもり 今は春べと 咲くやこの花（序歌）",
        "秋の田の かりほの庵の 苫をあらみ わが衣手は 露にぬれつつ（天智天皇）",
        "春過ぎて 夏来にけらし 白妙の 衣ほすてふ 天の香具山（持統天皇）",
        "むらさめの 露もまだひぬ 槇の葉に 霧立ちのぼる 秋の夕暮れ（寂蓮法師）",
        "住の江の 岸に寄る波 よるさへや 夢の通ひ路 人目よくらむ（藤原敏行朝臣）",
        "めぐりあひて 見しやそれとも わかぬ間に 雲がくれにし 夜半の月かな（紫式部）",
        "吹くからに 秋の草木の しをるれば むべ山風を 嵐といふらむ（文屋康秀）",
        "さびしさに 宿を立ち出でて ながむれば いづこも同じ 秋の夕暮れ（良暹法師）",
        "ほととぎす 鳴きつる方を ながむれば ただ有明の 月ぞ残れる（後徳大寺左大臣）",
        "瀬をはやみ 岩にせかるる 滝川の われても末に 逢はむとぞ思ふ（崇徳院）",
      ];
      let secretMode = localStorage.getItem("secretMode") === "1";

      function esc(str) {
        return String(str).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
      }

      async function loadMembers() {
        try {
          const data = await fetch(`${API_BASE_URL}/api/members`).then(r => r.json());
          membersMap = {};
          (data.members || []).forEach(m => membersMap[m.name] = m);
        } catch (e) { console.error(e); }
      }

      function plateHtml(name) {
        const m = membersMap[name] || {};
        const rank = RANKS.includes(m.rank) ? m.rank : "";
        const flair = FLAIR_LABELS[m.flair] ? m.flair : "";
        const badge = flair ? FLAIR_LABELS[flair] : (rank ? `${rank}級` : "");
        return `<li class="has-plate"><span class="plate ${rank ? 'rank-' + rank : ''} ${flair ? 'flair-' + flair : ''}" data-name="${esc(name)}">${badge ? `<span class="rank-badge">${badge}</span>` : ''}${esc(name)}</span></li>`;
      }

      function syncProfileUI() {
        const me = membersMap[currentUser] || {};
        document.getElementById("rankSelect").value = me.rank || "";
        const flairSel = document.getElementById("flairSelect");
        flairSel.value = me.flair || "";
        flairSel.style.display = secretMode ? "" : "none";
      }

      async function saveProfile() {
        if(!currentUser) return;
        const body = { userName: currentUser, rank: document.getElementById("rankSelect").value };
        if(secretMode) body.flair = document.getElementById("flairSelect").value;
        try {
          const data = await fetch(`${API_BASE_URL}/api/members`, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(body),
          }).then(r => r.json());
          if(!data.success) throw new Error(data.error);
          membersMap[currentUser] = data.member;
          document.querySelectorAll("#slotList .plate").forEach(el => {
            if(el.dataset.name === currentUser) el.parentElement.outerHTML = plateHtml(currentUser);
          });
          showToast("段位を保存しました");
        } catch (e) { showToast("保存に失敗しました"); syncProfileUI(); }
      }

      let toastTimer;
      function showToast(msg, ms = 2500) {
        const t = document.getElementById("toast");
        t.textContent = msg;
        t.style.display = "block";
        clearTimeout(toastTimer);
        toastTimer = setTimeout(() => t.style.display = "none", ms);
      }

      // --- 裏技 ---
      function toggleSecretMode() {
        secretMode = !secretMode;
        localStorage.setItem("secretMode", secretMode ? "1" : "0");
        syncProfileUI();
        if(secretMode) petalRain();
        showToast(secretMode ? "🎴 裏モード解禁：裏装飾が選べます" : "裏モードを閉じました");
      }

      function petalRain(chars = ["🌸", "🎴", "🍁"]) {
        for (let i = 0; i < 36; i++) {
          const p = document.createElement("span");
          p.className = "petal";
          p.textContent = chars[i % chars.length];
          p.style.left = Math.random() * 100 + "vw";
          p.style.animationDuration = 2.5 + Math.random() * 2.5 + "s";
          p.style.animationDelay = Math.random() * 1.2 + "s";
          p.addEventListener("animationend", () => p.remove());
          document.body.appendChild(p);
        }
      }

      function showPoem() {
        showToast("📜 " + POEMS[Math.floor(Math.random() * POEMS.length)], 6000);
      }

      function toggleMomiji() {
        const on = document.body.classList.toggle("momiji");
        localStorage.setItem("momiji", on ? "1" : "0");
        if(on) petalRain(["🍁", "🍂"]);
        showToast(on ? "🍁 からくれなゐに 水くくるとは" : "紅葉テーマを閉じました");
      }

      // お手つき：マスとプレートが一瞬バラバラに崩れて戻る
      function otetsuki() {
        const els = document.querySelectorAll(".dateBtn, .plate, .nav-btn, .join-btn");
        els.forEach(el => {
          el.style.transition = "transform 0.35s cubic-bezier(.3,1.6,.5,1)";
          el.style.transform = `translate(${(Math.random() - 0.5) * 30}px, ${Math.random() * 40}px) rotate(${(Math.random() - 0.5) * 50}deg)`;
        });
        showToast("💥 お手つき！");
        setTimeout(() => els.forEach(el => el.style.transform = ""), 1300);
        setTimeout(() => els.forEach(el => el.style.transition = ""), 1700);
      }

      // 名前欄に入れると入室せずに発動する合言葉
      const SECRET_WORDS = {
        "むすめふさほせ": toggleSecretMode,
        "ちはやふる": toggleMomiji,
        "おてつき": otetsuki,
        "なにわづ": showPoem,
      };

      function initSecrets() {
        if(localStorage.getItem("momiji") === "1") document.body.classList.add("momiji");

        // 5月27日（百人一首の日）は開くだけで札吹雪
        const now = new Date();
        if(now.getMonth() === 4 && now.getDate() === 27 && !sessionStorage.getItem("hyakuninDay")) {
          sessionStorage.setItem("hyakuninDay", "1");
          petalRain();
          showToast("🎴 今日は百人一首の日", 4000);
        }

        // 「○月○日 参加状況」の見出しをダブルタップ → 今日の一首
        document.getElementById("selectedDateText").addEventListener("dblclick", showPoem);

        // 月タイトルを3秒以内に7回連打 → 裏モード切替
        let taps = [];
        document.getElementById("monthYear").addEventListener("click", () => {
          const now = Date.now();
          taps = taps.filter(t => now - t < 3000);
          taps.push(now);
          if(taps.length >= 7) { taps = []; toggleSecretMode(); }
        });

        // コナミコマンド → 札吹雪
        const konami = ["ArrowUp", "ArrowUp", "ArrowDown", "ArrowDown", "ArrowLeft", "ArrowRight", "ArrowLeft", "ArrowRight", "b", "a"];
        let pos = 0;
        document.addEventListener("keydown", e => {
          pos = (e.key === konami[pos]) ? pos + 1 : (e.key === konami[0] ? 1 : 0);
          if(pos === konami.length) { pos = 0; petalRain(); }
        });

        // 自分のネームプレートを長押し → 札吹雪
        let pressTimer;
        const list = document.getElementById("slotList");
        list.addEventListener("pointerdown", e => {
          const plate = e.target.closest(".plate");
          if(!plate || plate.dataset.name !== currentUser) return;
          pressTimer = setTimeout(petalRain, 700);
        });
        ["pointerup", "pointerleave", "pointercancel"].forEach(ev => list.addEventListener(ev, () => clearTimeout(pressTimer)));
        list.addEventListener("contextmenu", e => { if(e.target.closest(".plate")) e.preventDefault(); });
      }

      function login() {
        const val = document.getElementById("userNameInput").value.trim();
        // 名前欄に一字決まりを入力 → 入室せず裏モード切替
        if(SECRET_WORDS[val]) { document.getElementById("userNameInput").value = ""; return SECRET_WORDS[val](); }
        if(val) { localStorage.setItem("userName", val); location.reload(); }
      }
      function logout() { localStorage.removeItem("userName"); location.reload(); }

      const MONTH_COMBO = "--++-+-+";
      let monthTaps = "";
      function changeMonth(diff) {
        monthTaps = (monthTaps + (diff < 0 ? "-" : "+")).slice(-MONTH_COMBO.length);
        if(monthTaps === MONTH_COMBO) { monthTaps = ""; petalRain(); showToast("🎴 札吹雪"); }
        viewDate.setMonth(viewDate.getMonth() + diff);
        renderCalendar();
      }

      async function renderCalendar() {
        if(currentUser) {
          document.getElementById("loginArea").style.display = "none";
          document.getElementById("loggedInUser").style.display = "flex";
          document.getElementById("userNameDisplay").textContent = currentUser;
        }
        const y = viewDate.getFullYear(), m = viewDate.getMonth() + 1;
        document.getElementById("monthYear").textContent = `${y}年 ${m}月`;

        loadMembers().then(syncProfileUI);

        try {
          const res = await fetch(`${API_BASE_URL}/api/notes-by-month?year=${y}&month=${m}`);
          const data = await res.json();
          const notesMap = {};
          if(data.notes) data.notes.forEach(n => notesMap[n.date] = n.room);

          const cal = document.getElementById("calendar");
          cal.innerHTML = "";
          ["日", "月", "火", "水", "木", "金", "土"].forEach((d, i) => cal.innerHTML += `<div class="dayName ${i === 0 ? 'sun' : i === 6 ? 'sat' : ''}">${d}</div>`);

          const first = new Date(y, m - 1, 1).getDay();
          const last = new Date(y, m, 0).getDate();
          
          const today = new Date();
          const todayKey = `${today.getFullYear()}-${today.getMonth() + 1}-${today.getDate()}`;

          for (let i = 0; i < first; i++) cal.innerHTML += `<div></div>`;
          for (let d = 1; d <= last; d++) {
            const dateKey = `${y}-${m}-${d}`;
            const btn = document.createElement("div");
            btn.className = "dateBtn";
            if (dateKey === todayKey) btn.classList.add("today");
            const dow = (first + d - 1) % 7;
            if (dow === 0) btn.classList.add("sun");
            if (dow === 6) btn.classList.add("sat");
            
            btn.innerHTML = `<span class="date-num">${d}</span>${notesMap[dateKey] ? `<div class="room-label">${esc(notesMap[dateKey])}</div>` : ""}`;
            btn.onclick = () => showDetail(y, m, d);
            cal.appendChild(btn);
          }
        } catch (e) { console.error(e); }
      }

      function backToCalendar() {
        document.getElementById("detailView").style.display = "none";
        document.getElementById("calendarView").style.display = "block";
        renderCalendar();
      }

      async function showDetail(y, m, d) {
        const dateKey = `${y}-${m}-${d}`;
        document.getElementById("calendarView").style.display = "none";
        document.getElementById("detailView").style.display = "block";
        document.getElementById("selectedDateText").textContent = `${m}月${d}日 参加状況`;

        const listDiv = document.getElementById("slotList");
        listDiv.innerHTML = '<div class="loading">読み込み中...</div>';

        try {
          // 全時間枠の参加者データを取得
          const fetchTasks = slots.map(s => fetch(`${API_BASE_URL}/api/participants?date=${dateKey}&timeSlot=${s}`).then(r => r.json()));
          const fetchNote = fetch(`${API_BASE_URL}/api/notes-by-month?year=${y}&month=${m}`).then(r => r.json());
          const [results, noteData] = await Promise.all([Promise.all(fetchTasks), fetchNote, loadMembers()]);
          syncProfileUI();

          listDiv.innerHTML = results.map((data, i) => {
            const members = data.participants || [];
            const isJoined = members.includes(currentUser);
            return `
              <div class="slot-box ${isJoined ? 'joined' : ''}">
                <div class="slot-title">
                  <span><span class="slot-time">${slots[i]}</span><span class="slot-count">${members.length}名</span></span>
                  <button class="join-btn ${isJoined ? 'active' : ''}" onclick="toggleJoin('${dateKey}','${slots[i]}')">${isJoined ? '取消' : '参加'}</button>
                </div>
                <ul class="participant-list">
                  ${members.length > 0 ? members.map(plateHtml).join('') : '<li class="empty">まだ参加者がいません</li>'}
                </ul>
              </div>`;
          }).join('');

          const todayNote = noteData.notes?.find(n => n.date === dateKey);
          document.getElementById("roomSelect").value = todayNote?.room || "";
          document.getElementById("noteText").value = todayNote?.text || "";

          document.getElementById("saveAdminBtn").onclick = async () => {
            await fetch(`${API_BASE_URL}/api/notes`, {
              method: "POST",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify({ 
                date: dateKey, 
                room: document.getElementById("roomSelect").value, 
                text: document.getElementById("noteText").value,
                color: "#ffffff"
              }),
            });
            alert("保存しました");
            renderCalendar(); 
          };
        } catch (e) { listDiv.innerHTML = '<div class="loading">通信エラーが発生しました</div>'; }
      }

      async function toggleJoin(date, slot) {
        if(!currentUser) return alert("お名前を入力して入室してください");
        await fetch(`${API_BASE_URL}/api/participate`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ date, timeSlot: slot, userName: currentUser }),
        });
        const p = date.split("-");
        showDetail(p[0], p[1], p[2]);
      }

      initSecrets();
      renderCalendar();
    </script>
  </body>
</html>
